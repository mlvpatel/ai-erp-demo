name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    name: Control-plane unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai_control_plane
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./services/ai_control_plane
      - run: python -m unittest discover -s tests/contract -v

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.14.10
      - run: ruff check --no-cache apps/ services/

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Run static quality gates
        run: scripts/run-quality-gates.sh
      - name: Validate development compose configuration
        run: scripts/dev.sh compose-config

  aws-iac:
    name: AWS IaC validation (no credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install checksum-verified Terraform
        env:
          TERRAFORM_VERSION: '1.13.5'
          TERRAFORM_SHA256: 0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a
        run: |
          set -euo pipefail
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          echo "${TERRAFORM_SHA256}  /tmp/${archive}" | sha256sum --check -
          mkdir -p /tmp/terraform-bin
          unzip -q "/tmp/${archive}" -d /tmp/terraform-bin
          echo "/tmp/terraform-bin" >> "$GITHUB_PATH"
          /tmp/terraform-bin/terraform version
      - run: python3 scripts/check-aws-iac.py
      - run: terraform -chdir=infra/aws/terraform fmt -check -recursive
      - run: terraform -chdir=infra/aws/terraform init -backend=false
      - run: terraform -chdir=infra/aws/terraform validate
      - run: terraform -chdir=infra/aws/bootstrap fmt -check -recursive
      - run: terraform -chdir=infra/aws/bootstrap init -backend=false
      - run: terraform -chdir=infra/aws/bootstrap validate
      - name: Validate production image runtime contract
        run: bash -n infra/images/frappe/runtime.sh
      - name: Test production bootstrap runtime
        run: python -m unittest discover -s tests/infra -v

  docker-behavior:
    name: ERP Docker behavior and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run synthetic ERP integration, capacity smoke, and browser gates
        run: scripts/ci-docker-gates.sh
