name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    name: Control-plane unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai_control_plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./services/ai_control_plane
      - run: python -m unittest discover -s tests/contract -v

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run static quality gates
        run: scripts/run-quality-gates.sh
      - name: Validate development compose configuration
        run: |
          cp development/.env.example development/.env
          docker compose --env-file development/.env -f infra/compose/docker-compose.dev.yml config --quiet
