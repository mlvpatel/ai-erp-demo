version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependency
      - ci
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /services/ai_control_plane
    schedule:
      interval: monthly
    labels:
      - dependency
      - ai-control-plane
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /apps/ai_erp_core
    schedule:
      interval: monthly
    labels:
      - dependency
      - erp-safety
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /apps/ai_erp_service
    schedule:
      interval: monthly
    labels:
      - dependency
      - erp-safety
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /services/ai_control_plane
    schedule:
      interval: monthly
    labels:
      - dependency
      - runtime
    open-pull-requests-limit: 2
