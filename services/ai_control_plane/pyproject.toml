[project]
name = "ai-erp-control-plane"
version = "0.1.0"
description = "Stateless, draft-only AI control plane for AI ERP Demo"
authors = [
    { name = "AI ERP Demo contributors", email = "mlvpatel@users.noreply.github.com" },
]
license = { text = "AGPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_erp_control_plane"]
